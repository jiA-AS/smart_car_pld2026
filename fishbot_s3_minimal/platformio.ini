; ============================================================================
; FishBot 四驱V2（ESP32-S3）最小工程 —— PLD2026 智能小车竞赛
; 功能：DBus遥控驾驶 + 编码器/IMU采集 + V1.0协议 100Hz 发帧给 FPGA
; 依赖平台：espressif32@6.x（Arduino 2.x）
;   ※ 鱼香的电机/编码器库使用旧版 MCPWM/PCNT 驱动，Arduino 3.x 已移除，
;     所以必须锁定 6.x 平台，不要升级！
; ============================================================================

[env:fishbot_s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ---- 与鱼香四驱V2板一致的硬件参数：4MB QIO Flash、无 PSRAM、240MHz ----
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_cpu = 240000000L

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    https://github.com/fishros/Esp32PcntEncoder.git
    https://github.com/fishros/Esp32McpwmMotor.git
